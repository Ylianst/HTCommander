name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            wix_arch: x64
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Build Windows
        working-directory: src
        env:
          # Firebase C++ SDK ships a CMakeLists.txt with cmake_minimum_required
          # below 3.5, which CMake 4.x (on windows-latest) rejects. This env var
          # tells CMake to assume a 3.5 policy minimum so the build configures.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: flutter build windows --release

      - name: Build and stage web app
        working-directory: src
        shell: pwsh
        run: |
          # Compile the Flutter web UI (hosted variant) and stage it next to the
          # executable so the desktop app can serve it over the built-in web
          # server. Shared pubspec assets (assets/assets) are dropped because the
          # desktop app serves them from its own bundle.
          flutter build web --base-href / --dart-define=HTC_HOSTED=true --no-wasm-dry-run
          $dest = "build/windows/${{ matrix.arch }}/runner/Release/web_app"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force build/web/* $dest
          $dup = Join-Path $dest 'assets/assets'
          if (Test-Path $dup) { Remove-Item -Recurse -Force $dup }

      - name: Sign Windows executable
        uses: azure/trusted-signing-action@v0.4.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: src\build\windows\${{ matrix.arch }}\runner\Release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          # Flutter Windows apps link against the Visual C++ runtime
          # (MSVCP140.dll, VCRUNTIME140.dll, VCRUNTIME140_1.dll). Machines without
          # the VC++ Redistributable installed fail to launch with a missing-DLL
          # error, so we ship the runtime app-locally next to the executable.
          $buildDir = "src\build\windows\${{ matrix.arch }}\runner\Release"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          if (-not $vsPath) { Write-Error "Visual Studio installation not found"; exit 1 }

          $redistRoot = Join-Path $vsPath "VC\Redist\MSVC"
          # The redist root also contains non-version folders (e.g. "v143", "v145"),
          # so keep only the numeric version directories before sorting.
          $verDir = Get-ChildItem -Path $redistRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+' } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $crtDir = Get-ChildItem -Path (Join-Path $verDir.FullName "${{ matrix.arch }}") -Directory -Filter "Microsoft.VC*.CRT" |
            Select-Object -First 1
          if (-not $crtDir) { Write-Error "Visual C++ CRT redistributable not found under $($verDir.FullName)"; exit 1 }

          Write-Output "Bundling VC++ runtime from: $($crtDir.FullName)"
          Copy-Item -Path (Join-Path $crtDir.FullName "*.dll") -Destination $buildDir -Force
          Get-ChildItem -Path $buildDir -Filter "*140*.dll" | ForEach-Object { Write-Output "  bundled $($_.Name)" }

      - name: Create MSI installer
        shell: pwsh
        run: |
          # Install WiX Toolset v5
          dotnet tool install --global wix --version 5.0.2

          # Register the WiX UI extension so 'wix build -ext' can resolve it
          wix extension add -g WixToolset.UI.wixext/5.0.2

          $buildDir = "src\build\windows\${{ matrix.arch }}\runner\Release"
          $appDisplayName = "Handi-Talky Commander"
          $appName = "HTCommander"
          $exeName = "htcommander.exe"
          $icoPath = (Resolve-Path "src\htcommander.ico").Path
          $licenseRtf = (Resolve-Path "src\windows\LICENSE.rtf").Path
          $dialogBmp = (Resolve-Path "src\windows\background.bmp").Path
          $bannerBmp = (Resolve-Path "src\windows\banner.bmp").Path
          $msiOutput = "HTCommander-${{ matrix.arch }}.msi"

          # Verify icon file exists
          if (-not (Test-Path $icoPath)) { Write-Error "Icon not found: $icoPath"; exit 1 }
          Write-Output "Using icon: $icoPath"

          # Build directory tree and file components
          $counter = 0
          $componentRefs = ""

          function Build-DirectoryXml($dirPath, $indent) {
            $xml = ""
            $script:counter++
            $files = Get-ChildItem -Path $dirPath -File
            foreach ($file in $files) {
              $script:counter++
              $fileId = "File$($script:counter)"
              $compId = "Comp$($script:counter)"
              $source = $file.FullName

              if ($file.Name -eq $exeName) {
                # Main exe component - include shortcut
                $xml += "$indent<Component Id='$compId' Guid='*'>`n"
                $xml += "$indent  <File Id='MainExe' Source='$source' KeyPath='yes' />`n"
                  $xml += "$indent  <Shortcut Id='StartMenuShortcut' Directory='ProgramMenuFolder' Name='$appDisplayName' Target='[#MainExe]' WorkingDirectory='INSTALLFOLDER' Icon='AppIcon' IconIndex='0' />`n"
                $xml += "$indent</Component>`n"
              } else {
                $xml += "$indent<Component Id='$compId' Guid='*'>`n"
                $xml += "$indent  <File Id='$fileId' Source='$source' KeyPath='yes' />`n"
                $xml += "$indent</Component>`n"
              }
              $script:componentRefs += "      <ComponentRef Id='$compId' />`n"
            }

            $subdirs = Get-ChildItem -Path $dirPath -Directory
            foreach ($subdir in $subdirs) {
              $script:counter++
              $dirId = "Dir$($script:counter)"
              $xml += "$indent<Directory Id='$dirId' Name='$($subdir.Name)'>`n"
              $xml += (Build-DirectoryXml $subdir.FullName "$indent  ")
              $xml += "$indent</Directory>`n"
            }
            return $xml
          }

          $directoryContent = Build-DirectoryXml $buildDir "          "

          $wxsContent = @"
          <?xml version='1.0' encoding='UTF-8'?>
          <Wix xmlns='http://wixtoolset.org/schemas/v4/wxs'
               xmlns:ui='http://wixtoolset.org/schemas/v4/wxs/ui'>
            <Package Name='$appDisplayName'
                     Manufacturer='HTCommander'
                     Version='1.0.0.0'
                     UpgradeCode='6B29FC40-CA47-1067-B31D-00DD010662DA'>

              <MajorUpgrade DowngradeErrorMessage='A newer version of $appDisplayName is already installed.' />
              <MediaTemplate EmbedCab='yes' />
              <ui:WixUI Id='WixUI_InstallDir' InstallDirectory='INSTALLFOLDER' />
              <WixVariable Id='WixUILicenseRtf' Value='$licenseRtf' />
              <WixVariable Id='WixUIDialogBmp' Value='$dialogBmp' />
              <WixVariable Id='WixUIBannerBmp' Value='$bannerBmp' />

              <Icon Id='AppIcon' SourceFile='$icoPath' />
              <Property Id='ARPPRODUCTICON' Value='AppIcon' />
              <Property Id='ARPCOMMENTS' Value='Amateur Radio (HAM Radio) tool for the UV-Pro, GA-5WB, VR-N76, VR-N7500 and compatible radios.' />

              <StandardDirectory Id='ProgramFiles6432Folder'>
                <Directory Id='INSTALLFOLDER' Name='$appName'>
          $directoryContent
                </Directory>
              </StandardDirectory>

              <Feature Id='MainFeature' Title='$appDisplayName' Level='1'>
          $componentRefs
              </Feature>
            </Package>
          </Wix>
          "@

          $wxsContent | Out-File -FilePath "installer.wxs" -Encoding UTF8

          # Build the MSI
          wix build installer.wxs -ext WixToolset.UI.wixext -arch ${{ matrix.wix_arch }} -o $msiOutput

      - name: Sign MSI installer
        uses: azure/trusted-signing-action@v0.4.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-${{ matrix.arch }}
          path: HTCommander-${{ matrix.arch }}.msi
