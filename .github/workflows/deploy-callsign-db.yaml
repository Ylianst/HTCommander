name: Deploy Callsign Database (US)

# Rebuilds the offline US amateur callsign database from the FCC ULS weekly
# amateur dump and publishes it. The large database zip is uploaded as an asset
# on a GitHub Release (so it never bloats the git history); only the tiny
# manifest (which points at immutable, content-addressed assets) is committed
# under docs/callsign/ and served from GitHub Pages.
#
# It only rebuilds when the FCC has published newer data: the FCC file's
# Last-Modified date is compared against the sourceDate in the repository
# manifest. Pages is also compared with that manifest so a failed deployment is
# retried without unnecessarily rebuilding the database.

on:
  schedule:
    # Tuesdays 09:17 UTC. The FCC posts the weekly complete amateur dump over
    # the weekend, so by Tuesday the new file is reliably available.
    - cron: '17 9 * * 2'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and deploy even if the FCC data is unchanged'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Share the "pages" concurrency group with the main Pages deploy so the two
# workflows never publish at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FCC_URL: https://data.fcc.gov/download/pub/uls/complete/l_amat.zip
  MANIFEST: docs/callsign/fcc_amateur_manifest.json
  PAGES_MANIFEST: https://ylianst.github.io/HTCommander/callsign/fcc_amateur_manifest.json
  # The database archives are hosted as assets on this release tag so they never
  # bloat the git history. Asset names include their MD5, making every manifest
  # valid even if Pages deployment fails and an older manifest remains live.
  RELEASE_TAG: callsign-db
  BASELINE_ASSET: fcc_amateur.cdb.xz
  OVERLAY_ASSET: fcc_amateur_overlay.cdb.xz
  # Promote a fresh full baseline once the cumulative overlay grows past this
  # fraction of the baseline download size (see the callsign-compaction blog for
  # the cost-optimal derivation).
  PROMOTE_THRESHOLD: '0.20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine FCC data date
        id: fcc
        run: |
          set -euo pipefail
          # Read the Last-Modified header of the FCC weekly amateur dump without
          # downloading the whole file (a 1-byte range request returns headers).
          headers=$(curl -sSL -r 0-0 -o /dev/null -D - "$FCC_URL" || true)
          lm=$(printf '%s' "$headers" | tr -d '\r' \
                | awk -F': ' 'tolower($1)=="last-modified"{print $2}' | tail -n1)
          if [ -z "$lm" ]; then
            echo "Could not read the FCC Last-Modified date (service down?)."
            echo "fcc_date=" >> "$GITHUB_OUTPUT"
          else
            fcc_date=$(date -u -d "$lm" +%Y%m%d)
            echo "FCC data date: $fcc_date (Last-Modified: $lm)"
            echo "fcc_date=$fcc_date" >> "$GITHUB_OUTPUT"
          fi

      - name: Read current database dates
        id: current
        run: |
          set -euo pipefail
          # The repository manifest is the source of truth. Also read the live
          # Pages manifest so a previously failed Pages deployment is retried
          # even when the FCC data itself has not changed.
          if [ -f "$MANIFEST" ]; then
            cur=$(jq -r '.overlay.sourceDate // .sourceDate // 0' "$MANIFEST")
          else
            cur=0
          fi
          live_manifest=$(mktemp)
          live=0
          pages_current=false
          if curl -fsSL "${PAGES_MANIFEST}?run=${{ github.run_id }}" \
               -o "$live_manifest" && jq -e . "$live_manifest" >/dev/null; then
            live=$(jq -r '.overlay.sourceDate // .sourceDate // 0' "$live_manifest")
            if cmp -s "$MANIFEST" "$live_manifest"; then
              pages_current=true
            fi
          fi
          rm -f "$live_manifest"
          echo "Repository data date: $cur"
          echo "Pages data date: $live"
          echo "source_date=$cur" >> "$GITHUB_OUTPUT"
          echo "pages_date=$live" >> "$GITHUB_OUTPUT"
          echo "pages_current=$pages_current" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        run: |
          set -euo pipefail
          force='${{ github.event.inputs.force }}'
          fcc='${{ steps.fcc.outputs.fcc_date }}'
          cur='${{ steps.current.outputs.source_date }}'
          pages_current='${{ steps.current.outputs.pages_current }}'
          if [ "$force" = "true" ]; then
            echo "Forced rebuild requested."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$fcc" ]; then
            echo "FCC date unknown; skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "$fcc" != "$cur" ]; then
            echo "New FCC data ($fcc != $cur); will rebuild."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Database already up to date ($cur); nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$force" = "true" ] || \
             { [ -n "$fcc" ] && [ "$fcc" != "$cur" ]; } || \
             [ "$pages_current" != "true" ]; then
            echo "Pages deployment required."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pages is already up to date."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download current baseline from Release
        id: baseline
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The overlay diff needs the currently published baseline to compare
          # against. Pull it into a path *separate* from the one the builder
          # writes to. A missing asset (first run) leaves the path empty, which
          # makes the builder promote a fresh full baseline.
          baseline_asset=$(jq -r '.url // "" | split("/")[-1]' "$MANIFEST")
          if [ -n "$baseline_asset" ] && \
             gh release download "$RELEASE_TAG" --pattern "$baseline_asset" \
               --output prev_baseline.cdb.xz 2>/dev/null; then
            echo "Downloaded baseline asset $baseline_asset."
            echo "path=prev_baseline.cdb.xz" >> "$GITHUB_OUTPUT"
          else
            echo "No baseline asset on the release yet (first run)."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build callsign database
        id: build
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          mkdir -p docs/callsign
          # Diff against the previous baseline when we have one; the builder then
          # either emits a small overlay (baseline carried forward from the
          # committed manifest) or promotes a fresh baseline past the threshold.
          baseline_arg=()
          if [ -n "${{ steps.baseline.outputs.path }}" ]; then
            baseline_arg=(--baseline "${{ steps.baseline.outputs.path }}" --current-manifest "$MANIFEST")
          fi
          # The manifest URLs point at the rolling Release assets (see below),
          # keeping the large archives out of the git history.
          python src/tools/build_fcc_db.py \
            --download \
            --source-date "${{ steps.fcc.outputs.fcc_date }}" \
            --out docs/callsign/fcc_amateur.cdb \
            --compress \
            --promote-threshold "$PROMOTE_THRESHOLD" \
            "${baseline_arg[@]}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/"
          # A promotion is the only case where the manifest's baseline sourceDate
          # advances to the new FCC date; otherwise only the overlay moved.
          new_date=$(jq -r '.sourceDate // 0' "$MANIFEST")
          if [ "$new_date" = "${{ steps.fcc.outputs.fcc_date }}" ]; then
            echo "Promoted a fresh baseline."
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "Published an overlay update; baseline unchanged."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          fi

          # Give each published archive an immutable, content-addressed name.
          # Replacing a stable asset before Pages updates can otherwise leave an
          # older live manifest pointing at bytes with a different checksum.
          overlay_md5=$(jq -r '.overlay.md5' "$MANIFEST")
          overlay_asset="fcc_amateur_overlay-${overlay_md5}.cdb.xz"
          mv "docs/callsign/$OVERLAY_ASSET" "docs/callsign/$overlay_asset"
          overlay_url="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${overlay_asset}"
          jq --arg url "$overlay_url" '.overlay.url = $url' "$MANIFEST" > "$MANIFEST.tmp"
          mv "$MANIFEST.tmp" "$MANIFEST"
          echo "overlay_asset=$overlay_asset" >> "$GITHUB_OUTPUT"

          if [ "$new_date" = "${{ steps.fcc.outputs.fcc_date }}" ]; then
            baseline_md5=$(jq -r '.md5' "$MANIFEST")
            baseline_asset="fcc_amateur-${baseline_md5}.cdb.xz"
            mv "docs/callsign/$BASELINE_ASSET" "docs/callsign/$baseline_asset"
            baseline_url="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${baseline_asset}"
            jq --arg url "$baseline_url" '.url = $url' "$MANIFEST" > "$MANIFEST.tmp"
            mv "$MANIFEST.tmp" "$MANIFEST"
            echo "baseline_asset=$baseline_asset" >> "$GITHUB_OUTPUT"
          fi

          # Refuse to publish a manifest that does not describe the exact local
          # archives produced by this run.
          verify_local_asset() {
            local path="$1"
            local manifest_path="$2"
            local expected_md5 expected_size actual_md5 actual_size
            expected_md5=$(jq -r "${manifest_path}.md5" "$MANIFEST")
            expected_size=$(jq -r "${manifest_path}.sizeBytes" "$MANIFEST")
            actual_md5=$(md5sum "$path" | awk '{print $1}')
            actual_size=$(stat -c '%s' "$path")
            if [ "$actual_md5" != "$expected_md5" ] || [ "$actual_size" != "$expected_size" ]; then
              echo "::error::Checksum or size mismatch for $path"
              return 1
            fi
          }
          verify_local_asset "docs/callsign/$overlay_asset" '.overlay'
          if [ "$new_date" = "${{ steps.fcc.outputs.fcc_date }}" ]; then
            verify_local_asset "docs/callsign/$baseline_asset" ''
          fi
          ls -l docs/callsign

      - name: Publish database to Release
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Ensure the database release exists, then upload immutable assets.
          # --latest=false keeps this rolling release from hijacking the repo's
          # "Latest" pointer, which the website's releases/latest/download links
          # rely on to resolve the app installers.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --latest=false \
              --title "Callsign Database" \
              --notes "Offline US amateur callsign database (FCC ULS). Assets are content-addressed and published automatically."
          fi

          # Uploads are idempotent, but an existing asset with the same
          # content-addressed name must be byte-for-byte identical.
          publish_asset() {
            local path="$1"
            local name="$2"
            local temp_dir check
            temp_dir=$(mktemp -d)
            check="$temp_dir/$name"
            if gh release download "$RELEASE_TAG" --pattern "$name" --output "$check" 2>/dev/null; then
              cmp "$path" "$check" || {
                echo "::error::Existing release asset $name does not match local bytes."
                rm -f "$check"
                rmdir "$temp_dir"
                return 1
              }
              echo "Verified existing release asset $name."
            else
              rm -f "$check"
              gh release upload "$RELEASE_TAG" "$path"
              gh release download "$RELEASE_TAG" --pattern "$name" --output "$check"
              cmp "$path" "$check" || {
                echo "::error::Uploaded release asset $name does not match local bytes."
                rm -f "$check"
                rmdir "$temp_dir"
                return 1
              }
              echo "Uploaded and verified release asset $name."
            fi
            rm -f "$check"
            rmdir "$temp_dir"
          }
          publish_asset \
            "docs/callsign/${{ steps.build.outputs.overlay_asset }}" \
            "${{ steps.build.outputs.overlay_asset }}"
          if [ "${{ steps.build.outputs.promoted }}" = "true" ]; then
            publish_asset \
              "docs/callsign/${{ steps.build.outputs.baseline_asset }}" \
              "${{ steps.build.outputs.baseline_asset }}"
          fi

          # Keep every archive out of the committed docs tree / Pages artifact.
          rm -f docs/callsign/*.cdb docs/callsign/*.cdb.xz prev_baseline.cdb.xz

      - name: Commit updated manifest
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "callsign-db: update FCC data ${{ steps.fcc.outputs.fcc_date }}"
            git push
          fi

      - name: Setup Pages
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
