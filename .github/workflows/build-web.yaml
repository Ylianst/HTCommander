name: Build Web

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Build Web
        working-directory: src
        run: flutter build web --release --base-href "/HTCommanderWeb/"

      - name: Upload Web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-build
          path: src/build/web/

      - name: Deploy to HTCommanderWeb
        run: |
          git clone https://x-access-token:${{ secrets.HTCOMMANDERWEB_TOKEN }}@github.com/Ylianst/HTCommanderWeb.git deploy
          cd deploy
          # Remove all files except LICENSE, README.md, and .git
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'LICENSE' ! -name 'README.md' -exec rm -rf {} +
          # Copy new build files
          cp -r ../src/build/web/* .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Deploy web build from ${{ github.repository }}@${{ github.sha }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.HTCOMMANDERWEB_TOKEN }}
